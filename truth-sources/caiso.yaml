version: "1"
kind: miner
id: 0
slug: truth-assize-caiso
protocol: generic
name: Assize CAISO day-ahead LMP
description: >
  Free, keyless CAISO day-ahead locational marginal prices from CAISO OASIS (PRC_LMP, DAM),
  served as JSON. OASIS itself answers with ZIP files.
base_url: https://assize.up.railway.app
auth:
  type: none
endpoints:
  - path: /caiso/price
    external_path: /caiso/price
    method: GET
    description: >
      GRID_POWER_PRICE for a CAISO pricing node: the NP15, SP15 and ZP26 trading hubs, or any CAISO APnode id
      such as TH_NP15_GEN-APND. Returns the day-ahead lmp_usd_per_mwh for the hour that contains interval_start.
    intents: [GRID_POWER_PRICE_GENERAL]
    params:
      query:
        required:
          - name: node_or_zone
            type: string
            intents: ["*"]
            description: "CAISO trading hub (NP15, SP15, ZP26) or APnode id, for example TH_NP15_GEN-APND."
          - name: interval_start
            type: string
            intents: ["*"]
            description: "Start of the settlement interval, RFC 3339 with a timezone, for example 2026-11-03T08:00:00Z."
semantics:
  supported_intents:
    - GRID_POWER_PRICE_GENERAL
